x-common-env: &common-env
  REDIS_DB: redis:6379
  POSTGRES_DB: postgres://gazoogle:gazoogle@postgres:5432/gazoogle
  EMBEDDING_URL: http://embedding:80
  VITE_API_URL: http://query_engine:8080
  PORT: 8080
services:
  crawler:
    build:
      context: ./crawler
      dockerfile: dockerfile
    depends_on:
      - redis
    restart: "unless-stopped"
    environment:
      <<: *common-env

  indexer:
    build:
      context: ./indexer
      dockerfile: dockerfile
    depends_on:
      - redis
      - postgres
      - embedding
    restart: "unless-stopped"
    environment:
      <<: *common-env

  query_engine:
    build:
      context: ./query_engine
      dockerfile: dockerfile
    depends_on:
      - postgres
      - embedding
    restart: "always"
    environment:
      <<: *common-env

    ports:
      - "8080:8080"

  ui:
    build:
      context: ./ui
      dockerfile: dockerfile
    restart: "always"
    environment:
      <<: *common-env
    ports:
      - "80:80"
    depends_on:
      - query_engine

  redis:
    image: redis:8
    restart: "unless-stopped"
    ports:
      - "6379:6379"
  postgres:
    image: pgvector/pgvector:pg18-trixie # pgvector image is identical to postgres but has the pgvector extension
    restart: "always"
    environment:
      - POSTGRES_DB=gazoogle
      - POSTGRES_USER=gazoogle
      - POSTGRES_PASSWORD=gazoogle
    ports:
      - "5555:5432" # 5432 was already in use lol
    volumes:
      - pgdata:/var/lib/postgresql/data
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2"]
    ports:
      - "1234:80"
    volumes:
      - "~/data:/data:z" # this will create a folder at ~/data for cache
    restart: "always"

volumes:
  pgdata:
